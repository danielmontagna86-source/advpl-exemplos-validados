name: Complete requested maintenance

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  complete:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout automation files
        uses: actions/checkout@v4
        with:
          ref: main
          path: control

      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: chore/plugin-index-style-rules
          fetch-depth: 0
          path: work

      - name: Apply and validate requested maintenance
        working-directory: work
        run: python ../control/.github/maintenance/apply_requested_maintenance.py

      - name: Show mandatory evidence
        working-directory: work
        shell: bash
        run: |
          echo '--- git status --short ---'
          git status --short
          echo '--- git diff --stat ---'
          git diff --stat
          echo '--- references changed ---'
          git status --short -- references/

      - name: Commit changes to PR branch
        working-directory: work
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .claude-plugin/plugin.json scripts/build-index.py SKILL.md README.md scripts/update-repo.ps1 scripts/install-adapters.ps1 .gitattributes references/
          git commit -m 'Aprimorar manifesto, índice e adaptadores da skill'
          git push origin chore/plugin-index-style-rules
